syntax = "proto3";

package agentstudio.v1;

option csharp_namespace = "AgentStudio.Service.Protos";

service AgentFlowService {
  rpc ExecuteWorkflow (ExecuteWorkflowRequest) returns (ExecuteWorkflowResponse);
  rpc GetExplorer (GetExplorerRequest) returns (GetExplorerResponse);
  rpc SaveAgentNode (SaveAgentNodeRequest) returns (SaveAgentNodeResponse);
  rpc GetAgentNodes (GetAgentNodesRequest) returns (GetAgentNodesResponse);
}


message ExecuteWorkflowRequest {
  string flow_id = 1;
}

message ExecuteWorkflowResponse {
  bool success = 1;
  string execution_id = 2;
  string result_message = 3;
}

message GetExplorerRequest {
  string path = 1;
}



message ExplorerItem {
  string name = 1;
  string path = 2;
  ItemType type = 3;
}

enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_FILE = 1;
  ITEM_TYPE_FOLDER = 2;
}

message SaveAgentNodeRequest {
  AgentNode node = 1;
}

message SaveAgentNodeResponse {
  string id = 1;
  bool success = 2;
}

message GetAgentNodesRequest {
  string flow_id = 1;
}

message GetAgentNodesResponse {
  bool success = 1;
  string message = 2;
}

message GetExplorerResponse {
  bool success = 1;
  string message = 2;
}

message AgentNode {
  string id = 1;
  string name = 2;
  NodeType type = 3;
  Position position = 4;
  ModelConfig model_config = 5;
  string system_prompt = 6;
  string endpoint = 7;
  McpConfig mcp_config = 8;
}

enum NodeType {
  NODE_TYPE_UNSPECIFIED = 0;
  NODE_TYPE_AGENT = 1;
  NODE_TYPE_MODEL = 2;
  NODE_TYPE_PROMPT = 3;
  NODE_TYPE_MCP_CONNECTOR = 4;
}

message Position {
  double x = 1;
  double y = 2;
}

message ModelConfig {
  string provider = 1;
  string model_name = 2;
  float temperature = 3;
}

message McpConfig {
  string server_url = 1;
  string auth_token = 2;
  repeated string enabled_tools = 3;
}