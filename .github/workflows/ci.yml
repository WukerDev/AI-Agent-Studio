name: CI Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup .NET 11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'
        
    - name: Restore .NET dependencies
      run: dotnet restore AgentStudio/AgentStudio.sln

    - name: Build Solution
      run: dotnet build AgentStudio/AgentStudio.sln -c Release --no-restore

    - name: Run Integration Tests (gRPC, SignalR, Testcontainers)
      run: dotnet test AgentStudio/AgentStudio.Service.Tests/AgentStudio.Service.Tests.csproj -c Release --no-build --verbosity normal
